  ## RFDiffusion is pinned to GPU 1.
  rfdiffusion:
    image: nvcr.io/nim/ipd/rfdiffusion:latest
    pull_policy: always
    runtime: nvidia
    ports:
      - "8082:8000"
    volumes:
      - ${HOST_NIM_CACHE:-~/.cache/nim}:/opt/nim/.cache/
      # - ${HOST_NIM_CACHE:-~/.cache/nim}:/home/nvs/.cache/
    deploy:
      resources:
        reservations:
          devices:
            - driver: "nvidia"
              capabilities: [gpu]
              device_ids: ['0']
    environment:
      - NGC_CLI_API_KEY=${NGC_CLI_API_KEY:?Error NGC_CLI_API_KEY not set}
      # - NIM_CACHE_PATH=/home/nvs/.cache/nim/models
      - NIM_CACHE_PATH=/opt/nim/.cache/

  proteinmpnn:
    image: nvcr.io/nim/ipd/proteinmpnn:latest
    pull_policy: always
    runtime: nvidia
    ports:
      - "8083:8000"
    volumes:
      - ${HOST_NIM_CACHE:-~/.cache/nim}:/home/nvs/.cache/nim
    deploy:
      resources:
        reservations:
          devices:
            - driver: "nvidia"
              capabilities: [gpu]
              device_ids: ['1']
    environment:
      - NGC_CLI_API_KEY=${NGC_CLI_API_KEY:?Error NGC_CLI_API_KEY not set}
      # - NIM_CACHE_PATH=/home/nvs/.cache/nim/models
      - NIM_CACHE_PATH=/home/nvs/.cache/nim  
      



